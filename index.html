<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เงินของฉัน — รายรับรายจ่าย</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#171923;--muted:#73798a;--line:#e9ebf1;--primary:#635bff;--income:#16a34a;--expense:#ef4444;--shadow:0 12px 35px rgba(30,35,60,.08)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:1100px;margin:auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-size:22px;font-weight:800}.brand span{color:var(--primary)}
.user{display:flex;align-items:center;gap:10px}.avatar{width:40px;height:40px;border-radius:50%;background:#e9e7ff;display:grid;place-items:center;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.balance{padding:28px;background:linear-gradient(135deg,#635bff,#817aff);color:white;border:0}.balance small{opacity:.8}.amount{font-size:38px;font-weight:850;margin:8px 0 20px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{background:rgba(255,255,255,.15);padding:14px;border-radius:15px}.stat b{display:block;font-size:20px;margin-top:3px}
.grid{display:grid;grid-template-columns:1.35fr .8fr;gap:18px;margin-top:18px}.panel{padding:22px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.panel h2{font-size:18px;margin:0}.add{background:var(--primary);color:#fff;padding:11px 16px;border-radius:13px;font-weight:700}
.tx{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.tx:last-child{border-bottom:0}.icon{width:44px;height:44px;border-radius:14px;background:#f2f3f7;display:grid;place-items:center;font-size:20px}.tx-main{flex:1}.tx-main b{display:block}.tx-main small{color:var(--muted)}.money{font-weight:800}.in{color:var(--income)}.out{color:var(--expense)}
.login{position:fixed;inset:0;background:rgba(10,12,20,.55);display:grid;place-items:center;padding:20px}.loginbox{width:min(410px,100%);padding:28px}.loginbox h1{margin:0 0 7px}.loginbox p{color:var(--muted);margin-top:0}.field{margin:13px 0}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;outline:none;margin-top:6px;background:#fff}.primary{width:100%;padding:13px;border-radius:12px;background:var(--primary);color:#fff;font-weight:800}.demo{text-align:center;color:var(--muted);font-size:12px;margin-top:12px}
.modal{position:fixed;inset:0;background:rgba(10,12,20,.5);display:none;place-items:center;padding:20px}.modal.show{display:grid}.modalbox{width:min(470px,100%);padding:25px}.modalhead{display:flex;justify-content:space-between}.close{background:#f1f2f6;width:35px;height:35px;border-radius:50%}
@media(max-width:760px){.app{padding:15px}.grid{grid-template-columns:1fr}.amount{font-size:32px}.panel{padding:18px}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="loginbox card">
    <h1>ยินดีต้อนรับ 👋</h1><p>เข้าสู่ระบบเพื่อเก็บข้อมูลรายรับ–รายจ่ายของคุณ</p>
    <div class="field"><label>อีเมล</label><input id="email" type="email" placeholder="you@example.com"></div>
    <div class="field"><label>รหัสผ่าน</label><input id="password" type="password" placeholder="อย่างน้อย 6 ตัวอักษร"></div>
    <button class="primary" onclick="login()">เข้าสู่ระบบ</button>
    <div class="demo">ตอนนี้เป็นโหมดทดลอง • ข้อมูลเก็บในเครื่องนี้ก่อน</div>
  </div>
</div>

<main class="app" id="app" hidden>
<header><div class="brand">เงิน<span>ของฉัน</span> 💸</div><div class="user"><div><b id="userName">ผู้ใช้งาน</b><br><small style="color:var(--muted)">บัญชีของฉัน</small></div><div class="avatar" id="avatar">ฟ</div></div></header>

<section class="card balance">
  <small>ยอดคงเหลือ</small><div class="amount" id="balance">฿0.00</div>
  <div class="stats"><div class="stat">รายรับเดือนนี้<b id="income">฿0.00</b></div><div class="stat">รายจ่ายเดือนนี้<b id="expense">฿0.00</b></div></div>
</section>

<div class="grid">
<section class="card panel"><div class="panel-head"><h2>รายการล่าสุด</h2><button class="add" onclick="openModal()">+ เพิ่มรายการ</button></div><div id="transactions"></div></section>
<section class="card panel"><div class="panel-head"><h2>สรุป</h2></div>
<div style="padding:15px 0;border-bottom:1px solid var(--line)">จำนวนรายการ <b id="count" style="float:right">0</b></div>
<div style="padding:15px 0">หมวดที่ใช้เยอะสุด <b id="topCat" style="float:right">—</b></div>
<button style="margin-top:15px;width:100%;padding:12px;border-radius:12px;background:#f0efff;color:var(--primary);font-weight:800" onclick="logout()">ออกจากระบบ</button>
</section></div>
</main>

<div class="modal" id="modal"><div class="modalbox card">
<div class="modalhead"><h2 style="margin:0">เพิ่มรายการ</h2><button class="close" onclick="closeModal()">×</button></div>
<div class="field"><label>ประเภท</label><select id="type"><option value="income">รายรับ</option><option value="expense">รายจ่าย</option></select></div>
<div class="field"><label>จำนวนเงิน</label><input id="amount" type="number" min="0" step="0.01" placeholder="0.00"></div>
<div class="field"><label>หมวดหมู่</label><select id="category"><option>อาหาร</option><option>เดินทาง</option><option>ช้อปปิ้ง</option><option>บิล/ค่าใช้จ่าย</option><option>เงินเดือน</option><option>อื่น ๆ</option></select></div>
<div class="field"><label>รายละเอียด</label><input id="note" placeholder="เช่น ข้าวเที่ยง"></div>
<button class="primary" onclick="saveTx()">บันทึกรายการ</button>
</div></div>

<script>
const KEY='my-money-demo-v1';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{user:null,items:[]};
function money(n){return new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB'}).format(n)}
function login(){const email=document.getElementById('email').value.trim();if(!email)return alert('กรุณาใส่อีเมล');state.user={email,name:email.split('@')[0]||'ผู้ใช้งาน'};save();show()}
function logout(){state.user=null;save();show()}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function show(){document.getElementById('login').hidden=!!state.user;document.getElementById('app').hidden=!state.user;if(state.user){userName.textContent=state.user.name;avatar.textContent=state.user.name[0]?.toUpperCase()||'U';render()}}
function render(){let inc=state.items.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),out=state.items.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);balance.textContent=money(inc-out);income.textContent=money(inc);expense.textContent=money(out);count.textContent=state.items.length;
let cats={};state.items.filter(x=>x.type==='expense').forEach(x=>cats[x.category]=(cats[x.category]||0)+x.amount);let top=Object.entries(cats).sort((a,b)=>b[1]-a[1])[0];topCat.textContent=top?top[0]:'—';
transactions.innerHTML=state.items.slice(-8).reverse().map(x=>`<div class="tx"><div class="icon">${x.type==='income'?'💰':'🧾'}</div><div class="tx-main"><b>${esc(x.note||x.category)}</b><small>${esc(x.category)} • ${x.date}</small></div><div class="money ${x.type==='income'?'in':'out'}">${x.type==='income'?'+':'−'}${money(x.amount)}</div></div>`).join('')||'<p style="color:var(--muted)">ยังไม่มีรายการ ลองเพิ่มรายการแรกกันเลย</p>'}
function saveTx(){let amount=Number(document.getElementById('amount').value);if(!amount||amount<0)return alert('กรุณาใส่จำนวนเงิน');state.items.push({type:type.value,amount,category:category.value,note:note.value.trim(),date:new Date().toLocaleDateString('th-TH')});save();closeModal();document.getElementById('amount').value='';note.value='';render()}
function openModal(){modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
show();
</script>
</body>
</html>
